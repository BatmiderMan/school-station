<!DOCTYPE html>
<html lang="fa" dir="rtl" data-app="student">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>پنل دانش‌آموز</title>
<script>try{var __t=localStorage.getItem('ss_theme');if(__t)document.documentElement.setAttribute('data-theme',__t)}catch(e){}</script>
<style>
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#f3f1ea;color:#1d2420;font-family:Vazirmatn,system-ui,Tahoma,sans-serif;transition:opacity .28s}
@media(prefers-color-scheme:dark){html:not([data-theme=light]) #splash{background:#0d1210;color:#e8efec}}
html[data-theme=dark] #splash{background:#0d1210;color:#e8efec}
#splash.out{opacity:0;pointer-events:none}
#splash .sp-logo{filter:drop-shadow(0 10px 18px #0f766e44);animation:sp-pulse 1.8s ease-in-out infinite}
#splash h1{margin:0;font-size:19px;font-weight:800}
#splash .sp-ring{width:38px;height:38px;border-radius:50%;border:4px solid #0f766e2e;border-top-color:#0f766e;animation:sp-spin .85s linear infinite}
html[data-theme=dark] #splash .sp-ring{border-color:#4fd1bf2e;border-top-color:#4fd1bf}
@media(prefers-color-scheme:dark){html:not([data-theme=light]) #splash .sp-ring{border-color:#4fd1bf2e;border-top-color:#4fd1bf}}
#splash p{margin:0;max-width:300px;min-height:44px;font-size:14px;line-height:1.8;opacity:.8}
#splash button{border:0;border-radius:14px;padding:11px 22px;font:inherit;font-weight:800;background:#0f766e;color:#fff;cursor:pointer}
@keyframes sp-spin{to{transform:rotate(360deg)}}
@keyframes sp-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#netbar{position:fixed;z-index:80;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);max-width:92vw;display:flex;align-items:center;gap:10px;padding:7px 16px;border-radius:999px;font-size:12.5px;font-weight:700;box-shadow:0 6px 20px #0003;background:#0f766e;color:#fff}
#netbar[hidden]{display:none}
#netbar.of{background:#b45309}
#netbar button{border:0;border-radius:999px;padding:3px 12px;font:inherit;font-weight:800;background:#fff;color:#92400e;cursor:pointer}
#netbar .spn{width:12px;height:12px;border-radius:50%;border:2px solid #fff6;border-top-color:#fff;animation:sp-spin .8s linear infinite}
</style>
</head>
<body class="guest">
<div id="splash" role="status" aria-live="polite">
  <div class="sp-logo"><svg viewBox="0 0 512 512" width="76" height="76" aria-hidden="true"><defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f5f59"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#lg2)"/><path d="M116 386V292a22 22 0 0 1 22-22h40a22 22 0 0 1 22 22v94z" fill="#fff" fill-opacity=".62"/><path d="M214 386V232a22 22 0 0 1 22-22h40a22 22 0 0 1 22 22v154z" fill="#fff"/><path d="M312 386V332a22 22 0 0 1 22-22h40a22 22 0 0 1 22 22v54z" fill="#fff" fill-opacity=".38"/><path d="M256 112l15.5 31.4 34.6 5-25 24.4 5.9 34.5L256 190.9l-31 16.4 5.9-34.5-25-24.4 34.6-5z" fill="#fbbf24"/></svg></div>
  <h1>پنل دانش‌آموز</h1>
  <div class="sp-ring"></div>
  <p id="sp-msg">در حال اتصال به سرور…</p>
  <button id="sp-retry" type="button" hidden onclick="location.reload()">تلاش دوباره</button>
</div>
<div id="netbar" hidden></div>
<script>
(function(){
  var el=document.getElementById('splash'),msg=document.getElementById('sp-msg'),rt=document.getElementById('sp-retry'),timers=[];
  function set(m){if(msg)msg.textContent=m}
  function arm(){
    timers.forEach(clearTimeout);timers=[];rt.hidden=true;
    timers.push(setTimeout(function(){set('اتصال کندتر از حد معمول است؛ لطفاً کمی صبر کنید…')},5000));
    timers.push(setTimeout(function(){set('هنوز در حال تلاش برای اتصال هستیم. اگر خیلی طول کشید، دوباره امتحان کنید.');rt.hidden=false},16000));
  }
  arm();
  window.__splash={
    set:set,
    show:function(m){el.className='';el.style.display='flex';set(m||'در حال اتصال…');arm()},
    hide:function(){timers.forEach(clearTimeout);el.className='out';setTimeout(function(){el.style.display='none'},320)}
  };
  window.addEventListener('ss-slow',function(){if(el.style.display!=='none'&&el.className!=='out')set('اتصال کند است؛ در حال تلاش مجدد…')});
})();
</script>
<div id="shell">
  <aside id="rail">
    <div class="brand"><i><svg viewBox="0 0 512 512" width="42" height="42" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f5f59"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#lg)"/><path d="M116 386V292a22 22 0 0 1 22-22h40a22 22 0 0 1 22 22v94z" fill="#fff" fill-opacity=".62"/><path d="M214 386V232a22 22 0 0 1 22-22h40a22 22 0 0 1 22 22v154z" fill="#fff"/><path d="M312 386V332a22 22 0 0 1 22-22h40a22 22 0 0 1 22 22v54z" fill="#fff" fill-opacity=".38"/><path d="M256 112l15.5 31.4 34.6 5-25 24.4 5.9 34.5L256 190.9l-31 16.4 5.9-34.5-25-24.4 34.6-5z" fill="#fbbf24"/></svg></i><div><b id="who">پنل دانش‌آموز</b><small id="dt"></small></div></div>
    <nav id="nv"></nav>
    <div class="rail-foot"><button class="btn" onclick="logout()" style="width:100%">خروج</button></div>
  </aside>
  <div id="stage">
    <header id="top"><div><h1 id="pt">پنل دانش‌آموز</h1></div>
      <div class="acts"><button class="ib" id="inst" hidden title="نصب برنامه" aria-label="نصب برنامه"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></button><button class="ib" onclick="toggleTheme()" title="تم"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14A8 8 0 1110 4a6.5 6.5 0 0010 10z"/></svg></button><button class="ib hide-guest" onclick="logout()" title="خروج" style="font-size:12px">خروج</button></div></header>
    <main id="app"></main>
    <footer id="credit">created with ❤️ by Abolfazl Rayati</footer>
  </div>
</div>
<nav id="student-mobile-nav" aria-label="دسترسی سریع"></nav>
<div id="student-menu" hidden>
  <button class="student-menu-backdrop" onclick="closeStudentMenu()" aria-label="بستن فهرست"></button>
  <div class="student-menu-panel" role="dialog" aria-modal="true" aria-label="بخش‌های پنل دانش‌آموز">
    <div class="student-menu-head"><b>بخش‌های پنل</b><button type="button" class="ib" onclick="closeStudentMenu()" aria-label="بستن فهرست">✕</button></div>
    <div id="student-menu-links"></div>
    <button type="button" class="student-menu-logout" onclick="closeStudentMenu();logout()">خروج از حساب</button>
  </div>
</div>
<div id="toasts"></div>
<script type="module" src="/src/student.ts"></script>
</body>
</html>
